name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$MESSAGE" | sed -n 's/^release: *\(v[0-9][0-9A-Za-z.\-]*\).*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from commit message: $MESSAGE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.extract_version.outputs.version }}" \
            --title "${{ steps.extract_version.outputs.version }}" \
            --notes "${{ github.event.head_commit.message }}"
